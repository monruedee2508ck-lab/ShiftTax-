<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftTax</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#89D1C2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShiftTax">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: soft pastel nurse diary — one column app, rounded tinted cards, illustrated hero, bottom tab bar. Single light theme by design. */
:root{
  /* ShiftTax palette: Butter Yellow bg · Soft Mint primary · Pale Warm Yellow surface · Warm Dark Brown text · Coral Pink highlight */
  --bg:#FFFDF0; --surface:#F7F3E3; --surface2:#F1EBD6; --ink:#4A3E3D; --muted:#8B7E79; --line:#EAE1C8;
  --primary:#89D1C2; --primary-ink:#33483F; --primary-deep:#6FBDAC; --coral:#FFB3A7; --coral-soft:#FFEAE5; --field:#FFFEF8;
  --accent:#3F9684; --accent-ink:#33483F; --soft:#E3F4EF;
  --mint:#89D1C2; --mint-soft:#E3F4EF; --pink:#FFB3A7; --pink-soft:#FFEAE5; --pink-ink:#D66A5C;
  --lav:#b29ce6; --lav-soft:#f1ecfc; --lav-ink:#7a5fc4; --yel:#f2c96f; --yel-soft:#fdf4de; --sky:#8fc6ec; --sky-soft:#e8f3fc;
  --good:#3F9684; --bad:#E0705F; --warn:#D9A13A;
  --c1:#5b9bd8; --c2:#e6963a; --c3:#7b6fd0; --c4:#e06a8c; --c5:#9aa7a3; --c6:#a07cd6; --c7:#3fae8a; --c8:#d08a4e;
  --f-display:"Mitr","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Mitr","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --shadow:0 6px 18px rgba(150,120,60,.08);
  --r:20px; --nav-h:68px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.palette,.dstrip,.brk{max-width:100%;min-width:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand h1{font-size:19px;font-weight:700}
.brand p{margin:0;font-size:12px;color:var(--muted)}.brand p.tagline{color:#2f5fa8;font-size:11.5px;letter-spacing:.1px}
.sync{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.db i{background:var(--good)} .sync.err i{background:var(--bad)} .sync.wait i{background:var(--warn)}

.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.switcher strong{font-family:var(--f-display);font-size:17px;font-weight:600;text-align:center;flex:1}
.icon-btn{width:40px;height:40px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{background:var(--soft);border-radius:var(--r);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}

/* shift chips */
.chip{--c:var(--c5);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;line-height:1;padding:3px 5px;border-radius:5px;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.k1{--c:var(--c1)}.k2{--c:var(--c2)}.k3{--c:var(--c3)}.k4{--c:var(--c4)}.k5{--c:var(--c5)}.k6{--c:var(--c6)}.k7{--c:var(--c7)}.k8{--c:var(--c8)}

.palette{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.palette button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.palette button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.palette .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;text-align:center;color:var(--muted);padding-bottom:2px}
.dow.we{color:var(--bad)}
.day{min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0}
.day:hover{border-color:var(--accent)}
.day .d{font-family:var(--f-num);font-size:12px;font-weight:600;padding-left:2px}
.day.we{background:var(--surface2)}
.day.we .d,.day.hol .d{color:var(--bad)}
.day.hol{background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.day.today{border:2px solid var(--accent)}
.day .chips{display:flex;flex-direction:column;gap:2px}
.day .chip{font-size:10px;padding:2px 2px}
.day.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px}
.legend span{display:flex;gap:6px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
.sheet>*{flex-shrink:0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sheet-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:2px}
.sheet-head h2{font-size:17px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.q{--c:var(--c5);border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:78px}
.q b{font-family:var(--f-display);font-size:20px;line-height:1.25;color:var(--c)}
.q span{font-size:12px;line-height:1.3;text-align:center}
.q small{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.q.on{background:var(--c);border-color:var(--c)}
.q.on b,.q.on span,.q.on small{color:var(--surface)}
.q:active{transform:scale(.97)}
details.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.sec summary{display:flex;justify-content:space-between;gap:10px;font-size:14px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"▸";color:var(--muted);margin-right:-4px}
details.sec[open] summary::before{content:"▾"}
details.sec summary span:first-of-type{flex:1;margin-left:8px}
details.sec[open] summary{margin-bottom:10px}
details.sec>*+*:not(summary){margin-top:8px}
.done-note{font-size:13px;color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface));padding:6px 10px;border-radius:8px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.pick.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.pick small{color:var(--muted);font-size:11px}

/* lists / payslip */
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);min-width:0}
.line:last-child{border-bottom:0}
.line .l{min-width:0;overflow-wrap:anywhere}
.line .v{white-space:nowrap}
.line.total{border-bottom:0;border-top:2px solid var(--ink);padding-top:9px;font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .date{font-family:var(--f-num);font-size:12px;color:var(--muted);width:28px;text-align:center}
.entry .meta{min-width:0}
.entry .meta div{overflow-wrap:anywhere}
.entry .x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px}
.entry .x:hover{background:var(--surface2);color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px;font-weight:500}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.seg button.on.ex{color:var(--bad)} .seg button.on.in{color:var(--good)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.catrow .bar{grid-column:1/-1}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}

/* tax */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;font-weight:500}
.pill.good{background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.brk{overflow-x:auto}
.brk table{width:100%;border-collapse:collapse;font-size:13px;min-width:340px}
.brk th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.brk th:first-child,.brk td:first-child{text-align:left}
.brk td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
.brk tr.on td{font-weight:600}
.brk tr.cur td{background:var(--soft)}
.brk tr.off td{color:var(--muted)}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0}
.plan .save{color:var(--good);font-weight:600}
input[type=range]{padding:0;border:0;accent-color:var(--accent);background:transparent}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
.auto{font-size:11px;color:var(--accent)}

/* chart */
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--accent)} .chart .be{fill:var(--c4);opacity:.75}
.chart .cur{fill:var(--soft)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:5px 2px;border-radius:10px;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:600;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:16px 8px;font-size:14px}
.st-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:0}
.st-row .wide{grid-column:span 2}
@media (max-width:460px){.st-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* daily money */
.dstrip{display:flex;gap:6px;overflow-x:auto;position:relative;scrollbar-width:none;padding:2px}
.dstrip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center}
.dchip small{font-size:11px;color:var(--muted);line-height:1.2}
.dchip b{font-size:16px;line-height:1.3}
.dchip i{width:5px;height:5px;border-radius:50%;margin-top:2px;background:transparent}
.dchip i.has{background:var(--accent)}
.dchip.we small{color:var(--bad)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip.on small{color:inherit;opacity:.85}
.dchip.on i.has{background:var(--accent-ink)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{padding:12px;font-size:15px;font-weight:600}
.btn.exb{color:var(--bad)} .btn.inb{color:var(--good)}
.shi{display:block;object-fit:cover;flex:0 0 auto}
.shi.pi{width:24px;height:24px;border-radius:8px;margin-left:-6px}
.shi.qi{width:24px;height:24px;border-radius:8px;display:inline-block;vertical-align:middle;margin-right:4px}
.q b{display:flex;align-items:center;justify-content:center}
.shi.ci{width:14px;height:14px;border-radius:4px;margin-right:3px}
.shi.li{display:inline-block;width:20px;height:20px;border-radius:7px;vertical-align:middle;margin-right:4px}
.mcalhead,.mcalgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcalhead{text-align:center;font-size:12px;color:var(--muted)}
.mcal,.mcal-e{min-width:0;min-height:54px}
.mcal{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;gap:1px;color:inherit;font:inherit}
.mcal b{font-size:14px;line-height:1.3}
.mcal em{font-style:normal;font-size:10px;line-height:1.2;color:var(--bad);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcal .inmark{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.mcal.we b{color:var(--bad)}
.mcal.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mcal.on b,.mcal.on em{color:inherit}
.mcal.on .inmark{background:var(--accent-ink)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:150px}
.wk-col{display:flex;flex-direction:column;align-items:center;min-width:0;height:100%}
.wk-v{font-size:10px;line-height:1.2;min-height:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-bar{flex:1;width:100%;max-width:28px;min-height:0;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin:3px 0}
.wk-bar i{display:block;width:100%;background:var(--bad);opacity:.75;border-radius:8px 8px 0 0}
.wk-col small{font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap}
.bar.big{height:12px;border-radius:6px;margin:4px 0 6px}
.fab{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 8px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px rgba(47,143,114,.32),0 1px 3px rgba(0,0,0,.12);display:grid;place-items:center}
.fab svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.fab:active{transform:scale(.94)}
#toast .toast{bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px))}
.palgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.pt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;min-width:0;color:inherit}
.pt .shi.pg,.pt .pgd{width:34px;height:34px;border-radius:11px}
.pt .pgd{display:grid;place-items:center;background:var(--surface2);font-size:12px;font-weight:600}

function keyShift(key,n){let [y,m]=key.split('-').map(Number);m-=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return mkey(y,m)}

function srcTag(c,k){const L=payLag(k);return L?` <span class="tag">ของเดือน${mShort(keyShift(c.key,L))}</span>`:''}
function monthCalc(key){const e=earnCalc(key);e.earn=e;if(!anyLag())return e;
  const src=k=>payLag(k)?earnCalc(keyShift(key,payLag(k))):e;
  const sS=src('salary'),sA=src('allow'),sR=src('shift'),sO=src('ot');
  const c=Object.assign({},e);
  c.salary=sS.salary;c.allow=sA.allow;
  c.otIn=sO.otIn;c.otOut=sO.otOut;c.ot=sO.ot;c.otHrs=sO.otHrs;c.otShiftN=sO.otShiftN;
  c.s401=(sR.s401-sR.otIn)+sO.otIn;c.s402=(sR.s402-sR.otOut)+sO.otOut;c.shift=c.s401+c.s402;
  c.sso=S.sso?Math.round(0.05*Math.min(Math.max(c.salary,SSO_MIN_WAGE),taxRule(c.y).ssoWage)):0;
  c.pvd=Math.round(c.salary*num(S.pvdPct)/100);
  c.gross=c.salary+c.allow+c.shift+e.x401+e.x402+e.xNone;c.net=c.gross-c.sso-c.pvd-e.withheld-e.fixDed;c.left=c.net-e.exp;
  c.hasShift=sR.hasShift||sO.hasShift;c.earn=e;c.lagged=true;return c}
function progressive(net){let tax=0,marg=0;const rows=BRACKETS.map(([lo,hi,r])=>{const amt=Math.max(0,Math.min(net,hi)-lo);const t=amt*r;tax+=t;if(amt>0)marg=r;return{lo,hi,r,amt,t}});return{tax,rows,marg}}
function taxCalc(y,extra){
  extra=extra||{};const T=taxP(y);const mons=[];for(let m=1;m<=12;m++)mons.push(monthCalc(mkey(y,m)));
  const ws=mons.filter(c=>c.hasShift);const a401=ws.length?sum(ws.map(c=>c.s401))/ws.length:0;const a402=ws.length?sum(ws.map(c=>c.s402))/ws.length:0;
  let inc401=0,inc402=0,sso=0,pvd=0,wh=0,proj=0,salaryAll=0,exempt=0;const auto={};const mrows=[];const R=taxRule(y);
  for(const c of mons){salaryAll+=c.salary+c.allow;let i1=c.salary+c.allow+c.x401,i2=c.x402,pj=false;
    if(c.hasShift){i1+=c.s401;i2+=c.s402}else if(T.project&&ws.length){i1+=a401;i2+=a402;proj++;pj=true}
    inc401+=i1;inc402+=i2;exempt+=c.xNone||0;mrows.push({m:c.m,key:c.key,i1,i2,pj,real:c.hasShift,wh:c.withheld,whE:c.whE||0});
    sso+=c.sso;pvd+=c.pvd;wh+=c.withheld;for(const k in c.ded)auto[k]=(auto[k]||0)+c.ded[k]}
  const xi1=num(T.x401),xi2=num(T.x402),inc408=num(T.x408),whx=num(T.whx);inc401+=xi1;inc402+=xi2;const whM=wh;wh+=whx;
  const total=inc401+inc402+inc408;const e12=Math.min((inc401+inc402)*.5,100000);const e8=inc408*.6;const expense=e12+e8;
  const raw=k=>num(T[k])+(auto[k]||0)+num(extra[k]);
  const v={};
  v.personal=60000;v.spouse=T.spouse?60000:0;v.children=num(T.child1)*30000+num(T.child2)*60000;
  v.parents=Math.min(4,num(T.parents))*30000;v.disabled=num(T.disabled)*60000;
  v.sso=Math.min(sso,R.sso);
  v.health=Math.min(raw('health'),25000);v.life=Math.min(raw('life'),100000);if(v.life+v.health>100000)v.life=Math.max(0,100000-v.health);
  v.parentsHealth=Math.min(raw('parentsHealth'),15000);
  v.pvd=Math.min(pvd,.15*salaryAll,500000);
  v.pension=Math.min(raw('pension'),.15*total,200000);
  v.rmf=Math.min(raw('rmf'),.30*total,500000);
  v.nsf=Math.min(raw('nsf'),30000);
  let over=v.pvd+v.pension+v.rmf+v.nsf-500000;
  for(const k of ['rmf','pension','nsf']){if(over<=0)break;const cut=Math.min(v[k],over);v[k]-=cut;over-=cut}
  v.thaiesg=Math.min(raw('thaiesg'),.30*total,R.esg);
  v.home=Math.min(raw('home'),100000);
  v.other=raw('other');
  const dedKeys=['personal','spouse','children','parents','disabled','sso','pvd','life','health','parentsHealth','pension','rmf','nsf','thaiesg','home','other'];
  const dedSum=sum(dedKeys.map(k=>v[k]));

  const p=progressive(net);let tax=p.tax,minTax=0;
  const non1=inc402+inc408;let alt=0;if(non1>=120000){alt=non1*.005;if(alt>5000&&alt>tax){minTax=alt;tax=alt}}
  return {y,T,R,mons,mrows,inc401,inc402,inc408,xi1,xi2,exempt,total,e12,e8,expense,v,auto,dedSum:dedSum+v.donate,before,net,stepTax:p.tax,alt,tax,rows:p.rows,marg:p.marg,minTax,wh,whM,whx,proj,shiftMonths:ws.length,sso,pvd}
}

const DEBT_IDS=['home','loan','install','card','edu','coop'];
function healthCalc(c){
  const sb=sub=>sum(DEFAULT_CATS.concat(S.catsCustom).filter(x=>x.t==='ex'&&x.g==='save'&&x.sub===sub).map(x=>c.byCat[x.id]||0));
  const inc=c.gross,sav=sb('savings')+sb('welfare')+sb('other'),inv=sb('invest')+sb('tax');
  const debt=sum(DEBT_IDS.map(i=>c.byCat[i]||0));const living=c.byGroup.fixed+c.byGroup.var;
  let liquid=0;for(const k in M){for(const e of (M[k].entries||[])){if(e.t!=='ex')continue;const x=catById('ex',e.cat);if(x&&x.g==='save'&&x.sub==='savings')liquid+=num(e.amt)}}
  const A=S.nw.assets,D=S.nw.debts;const aT=sum(A.map(x=>num(x.amt))),dT=sum(D.map(x=>num(x.amt)));const cashA=sum(A.filter(x=>x.type==='cash').map(x=>num(x.amt)));
  if(A.some(x=>x.type==='cash'))liquid=cashA;const passive=c.inGroup.asset||0;
  const has=inc>0&&(c.exp>0);
  return {inc,sav,inv,debt,living,liquid,has,aT,dT,passive,
    nw:(A.length||D.length)?{v:aT-dT,ok:aT-dT>=0}:null,
    surv:c.exp?{v:inc/c.exp,ok:inc/c.exp>=1}:null,
    wealth:c.exp?{v:passive/c.exp,ok:passive/c.exp>=1,mid:passive>0}:null,
    dta:aT?{v:dT/aT*100,ok:dT/aT<.5}:null,
    cash:{v:c.left,ok:c.left>=0},
    save:inc?{v:sav/inc*100,ok:sav/inc>=.1}:null,
    invest:inc?{v:inv/inc*100,ok:inv/inc>=.1}:null,
    debtR:inc?{v:debt/inc*100,ok:debt/inc<.35,mid:debt/inc<.45}:null,
    liq:living&&liquid?{v:liquid/living,ok:liquid/living>=3,mid:liquid/living>=1}:null};
}

function sixChart(rows){const W=340,H=150,L=34,B=22,T=10;const vals=rows.map(r=>{const act=r.hasShift||r.mo.entries.length||r.salary;return{i:act?r.gross:0,e:r.exp,m:r.m}});
  const mx=Math.max(1,...vals.map(v=>Math.max(v.i,v.e)));const step=niceStep(mx/3);const top=Math.ceil(mx/step)*step;const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L)/6;let g='';
  for(let t=0;t<=top+1e-6;t+=step){g+=`<line class="gl" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-4}" y="${y(t)+3}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`}
  vals.forEach((v,i)=>{const x=L+i*bw;const w=Math.min(16,(bw-14)/2);const cx=x+bw/2;
    if(v.i)g+=`<rect class="bi" x="${cx-w-1}" y="${y(v.i)}" width="${w}" height="${Math.max(0,H-B-y(v.i))}" rx="3"/>`;
    if(v.e)g+=`<rect class="be" x="${cx+1}" y="${y(v.e)}" width="${w}" height="${Math.max(0,H-B-y(v.e))}" rx="3"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" class="${i===5?'curm':''}">${TH_MS[v.m-1]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="รายรับรายจ่าย 6 เดือนล่าสุด">${g}</svg>`}
function yearChart(yr){
  const W=340,H=170,L=34,B=22,T=8;const vals=yr.map(r=>{const act=r.hasShift||r.mo.entries.length;return{i:act?r.gross:0,e:r.exp}});
  const mx=Math.max(1,...vals.map(v=>Math.max(v.i,v.e)));const step=niceStep(mx/3);const top=Math.ceil(mx/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L)/12;let g='';
  if(UI.y===yr[0].y){g+=`<rect class="cur" x="${L+(UI.m-1)*bw+1}" y="${T}" width="${bw-2}" height="${H-T-B}" rx="3"/>`}
  for(let t=0;t<=top+1e-6;t+=step){g+=`<line class="gl" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-4}" y="${y(t)+3}" text-anchor="end">${t>=1000?(t/1000)+'k':t}</text>`}
  vals.forEach((v,i)=>{const x=L+i*bw;const w=(bw-6)/2;
    if(v.i)g+=`<rect class="bi" x="${x+3}" y="${y(v.i)}" width="${w}" height="${Math.max(0,H-B-y(v.i))}" rx="1.5"/>`;
    if(v.e)g+=`<rect class="be" x="${x+3+w}" y="${y(v.e)}" width="${w}" height="${Math.max(0,H-B-y(v.e))}" rx="1.5"/>`;
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${TH_MS[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน">${g}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,undo){const el=$('#toast');el.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-act="undo">เลิกทำ</button>':''}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{el.innerHTML='';UI.lastUndo=null},5000)}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const tabB=ev.target.closest('[data-tab]');if(tabB){UI.tab=tabB.dataset.tab;UI.sheet=null;UI.notif=false;UI.donate=false;UI.logout=false;UI.mpick=false;UI.cneu=false;UI.esheet=null;UI.dsheet=null;UI.share=false;UI.setSec=null;UI.taxSec=null;UI.resetAsk=false;render();window.scrollTo(0,0);return}
  const sm=ev.target.closest('summary[data-sec]');if(sm){UI.sec[sm.dataset.sec]=!sm.parentElement.open;return}
  if(ev.target.id==='autonext'){UI.autoNext=ev.target.checked;try{localStorage.setItem('nr-autonext',UI.autoNext?'1':'0')}catch(e){}return}
  const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(b.classList.contains('scrim')&&ev.target.closest('[data-stop]'))return;
  const key=mkey(UI.y,UI.m);
  switch(act){
    case 'onb-google':UI.onbBusy=true;renderOnb();signIn().then(()=>{setTimeout(()=>{if(UI.onb==='auth'&&!fbUser){UI.onbBusy=false;renderOnb()}},1500)});break;
    case 'onb-local':UI.onb='auth';render();break;
    case 'pin-forgot-email':{const em=($('#pf-email').value||'').trim().toLowerCase();if(!S.email||em!==String(S.email).trim().toLowerCase()){toast('Gmail ไม่ตรงกับที่สมัครไว้');break}
      UI.pin={mode:'set',stage:'new',buf:'',msg:'ยืนยันตัวตนแล้ว ตั้ง PIN ใหม่ได้เลย'};UI.pinForgot=false;renderOnb();break}
    case 'pin-key':pinKey(b.dataset.k);break;
    case 'pin-restart':UI.pin={mode:'set',stage:'new',buf:''};renderOnb();break;
    case 'pin-cancel':UI.lock=false;UI.pin=null;renderOnb();break;
    case 'pin-change':startLock(S.pin?'change':'set');if(!S.pin){UI.pin.stage='new'}break;
    case 'pin-forgot':UI.pinForgot=b.dataset.v==='1';renderOnb();break;
    case 'pin-forgot-google':{try{await fbLoad();const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
        if(fbAuth.currentUser)await fbAuth.currentUser.reauthenticateWithPopup(pr);else await fbAuth.signInWithPopup(pr);
        UI.pin={mode:'set',stage:'new',buf:'',msg:'ยืนยันตัวตนแล้ว ตั้ง PIN ใหม่ได้เลย'};UI.pinForgot=false;renderOnb()}catch(e){authErr(e)}break}
    case 'onb-next':{if(UI.onb==='auth'||UI.onb===1){const v=($('#onb-name').value||'').trim();const em=($('#onb-email').value||'').trim().toLowerCase();
        if(!v){toast('ใส่ชื่อก่อนนะคะ');$('#onb-name').focus();break}
        if(!EMAIL_RE.test(em)){toast('ใส่ Gmail ให้ถูกต้อง เช่น name@gmail.com');$('#onb-email').focus();break}
        if(S.setupDone&&S.pin){UI.pendName=v;UI.pendEmail=em;S.onboarded=true;touch('settings');UI.onb=0;UI.setSec=null;UI.tab='roster';render();startLock('unlock');break}
        S.userName=v;S.email=em;if(!S.setupDone)S.regNew=true;touch('settings');
        if(S.setupDone||(!S.sample&&Object.keys(M).length)){S.setupDone=true;if(S.pin){S.onboarded=true;touch('settings');UI.onb=0;UI.setSec=null;UI.tab='roster';render();startLock('unlock');break}UI.onb=4;UI.pin=null;render();break}
        UI.onb=4;UI.pin=null;UI.setSec=null;render();window.scrollTo(0,0);break}
      else if(UI.onb===2){UI.setSec='types'}UI.onb++;render();window.scrollTo(0,0);break}
    case 'onb-back':UI.pin=null;UI.onb='auth';UI.setSec=null;render();break;
    case 'onb-done':if(UI.onb===3){for(const t of S.shiftTypes)if(t.work)t.hd=num(t.wd)}if(S.sample&&num(S.salary))S.sample=false;touch('settings');if(S.pin){finishSetup();toast(`พร้อมแล้วค่ะ คุณ${S.userName||''}`);break}UI.onb=4;UI.pin=null;UI.setSec=null;render();window.scrollTo(0,0);break;
    case 'profile-open':UI.tab='settings';UI.setSec='profile';UI.sheet=null;UI.notif=false;render();window.scrollTo(0,0);break;
    case 'av-del':S.avatar='';touch('settings');render();break;
    case 'pvd-pick':S.pvdPct=num(b.dataset.v);S.sample=false;touch('settings');document.querySelectorAll('[data-set=pvdPct]').forEach(i=>i.value=S.pvdPct);pvdRefresh();break;
    case 'donate-open':UI.donate=true;renderSheet();break;
    case 'donate-close':UI.donate=false;renderSheet();break;
    case 'donate-save':saveDonateQR();break;
    case 'lag-preset':{const v=b.dataset.v;S.payLag={salary:v==='all'?1:0,allow:v==='all'?1:0,shift:v==='0'?0:1,ot:v==='0'?0:1};S.sample=false;touch('settings');render();break}
    case 'mpick-open':UI.mpick=true;UI.mpy=UI.y;renderSheet();break;
    case 'mpick-close':UI.mpick=false;renderSheet();break;
    case 'mpy':UI.mpy+=+b.dataset.v;renderSheet();break;
    case 'mpick':UI.y=UI.mpy;UI.m=+b.dataset.m;UI.mpick=false;UI.selDay=null;render();break;
    case 'mpick-today':{const t=new Date();UI.y=t.getFullYear();UI.m=t.getMonth()+1;UI.mpick=false;render();break}
    case 'mprev':UI.m--;if(UI.m<1){UI.m=12;UI.y--}render();break;
    case 'mnext':UI.m++;if(UI.m>12){UI.m=1;UI.y++}render();break;
    case 'yprev':UI.ty--;render();break;
    case 'ynext':UI.ty++;render();break;
    case 'qmore':UI.qMore=!UI.qMore;render();break;

  gCheckHash();setTimeout(regSend,3000);connect();setTimeout(devNotify,1500);setInterval(()=>{devNotify();updateBell()},30*60*1000);
